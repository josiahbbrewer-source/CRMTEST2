          followupCategory: followupCategory,
          appointment: null,
          tags: [],
          favorite: false
        };
        // Assign timezone if provided
        newLead.timezone = timezone;
        // Compute followDate using followup and addedDate. Because there is no separate call date header for manual entries,

        newLead.followDate = parseFollowupDate(followup, followup, addedDatePart);

        newLead.score = statusScore + noteCount;
        leads.push(newLead);

        refreshUI();

        <button type='submit'>Add Note</button>
      `;
      genForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const content = genForm.note.value.trim();
        if (content) {
          client.notes.push({content: content, timestamp: new Date().toLocaleString()});
          genForm.reset();
          saveData();
          refreshUI();
          showClientDetail(client);
        }
      });
      detail.appendChild(genForm);
      // Dev notes
      const devH = document.createElement('h3'); devH.textContent = 'Development Notes'; detail.appendChild(devH);

      // Copy all development notes button, if any
      if (client.devNotes && client.devNotes.length) {
        const copyAllDev = document.createElement('button');
        copyAllDev.textContent = 'Copy All Dev Notes';
        copyAllDev.className = 'control secondary';
        copyAllDev.style.marginBottom = '0.5rem';
        copyAllDev.addEventListener('click', (ev) => {
          ev.stopPropagation();
          let txt = '';
          client.devNotes.forEach(n => {
            txt += n.timestamp + ' - ' + n.content + '\n';
          });
          copyToClipboard(txt.trim());
        });
        detail.appendChild(copyAllDev);
      }
      const devList = document.createElement('div'); devList.className = 'note-list';
      if (client.devNotes && client.devNotes.length) {
        client.devNotes.forEach(n => {
          const div = document.createElement('div');
          div.className = 'note';
          const small = document.createElement('small');
          small.textContent = n.timestamp;
          div.appendChild(small);
          const spanContent = document.createElement('span');
          spanContent.style.marginLeft = '0.3rem';
          spanContent.textContent = n.content;
          div.appendChild(spanContent);
          const cp = document.createElement('button');
          cp.textContent = '📋';
          cp.style.marginLeft = '0.4rem';
          cp.style.fontSize = '0.8rem';
          cp.style.border = 'none';
          cp.style.background = 'transparent';
          cp.style.cursor = 'pointer';
          cp.addEventListener('click', (ev) => {
            ev.stopPropagation();
            copyToClipboard(n.content);
          });
          div.appendChild(cp);
          devList.appendChild(div);
        });
      } else {
        const p = document.createElement('p'); p.textContent = 'No development notes.'; devList.appendChild(p);
      }
      detail.appendChild(devList);
      const devForm = document.createElement('form');
      devForm.innerHTML = `
        <div class='form-group'>
          <label>Add Dev Note</label>
          <textarea name='note' rows='3' required></textarea>
        </div>
        <button type='submit'>Add Note</button>
      `;
      devForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const content = devForm.note.value.trim();
        if (content) {
          client.devNotes.push({content: content, timestamp: new Date().toLocaleString()});
          devForm.reset();
          saveData();
          refreshUI();
          showClientDetail(client);
        }
      });
      detail.appendChild(devForm);
      // SEO notes
      const seoH = document.createElement('h3'); seoH.textContent = 'SEO Notes'; detail.appendChild(seoH);

      // Copy all SEO notes button, if any
      if (client.seoDevNotes && client.seoDevNotes.length) {
        const copyAllSEO = document.createElement('button');
        copyAllSEO.textContent = 'Copy All SEO Notes';
        copyAllSEO.className = 'control secondary';
        copyAllSEO.style.marginBottom = '0.5rem';
        copyAllSEO.addEventListener('click', (ev) => {
          ev.stopPropagation();
          let txt = '';
          client.seoDevNotes.forEach(n => {
            txt += n.timestamp + ' - ' + n.content + '\n';
          });
          copyToClipboard(txt.trim());
        });
        detail.appendChild(copyAllSEO);
      }
      const seoList = document.createElement('div'); seoList.className = 'note-list';
      if (client.seoDevNotes && client.seoDevNotes.length) {
        client.seoDevNotes.forEach(n => {
          const div = document.createElement('div');
          div.className = 'note';
          const small = document.createElement('small');
          small.textContent = n.timestamp;
          div.appendChild(small);
          const spanContent = document.createElement('span');
          spanContent.style.marginLeft = '0.3rem';
          spanContent.textContent = n.content;
          div.appendChild(spanContent);
          const cp = document.createElement('button');
          cp.textContent = '📋';
          cp.style.marginLeft = '0.4rem';
          cp.style.fontSize = '0.8rem';
          cp.style.border = 'none';
          cp.style.background = 'transparent';
          cp.style.cursor = 'pointer';
          cp.addEventListener('click', (ev) => {
            ev.stopPropagation();
            copyToClipboard(n.content);
          });
          div.appendChild(cp);
          seoList.appendChild(div);
        });
      } else {
        const p = document.createElement('p'); p.textContent = 'No SEO notes.'; seoList.appendChild(p);
      }
      detail.appendChild(seoList);
      const seoForm = document.createElement('form');
      seoForm.innerHTML = `
        <div class='form-group'>
          <label>Add SEO Note</label>
          <textarea name='note' rows='3' required></textarea>
        </div>
        <button type='submit'>Add Note</button>
      `;
      seoForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const content = seoForm.note.value.trim();
        if (content) {
          client.seoDevNotes.push({content: content, timestamp: new Date().toLocaleString()});
          seoForm.reset();
          saveData();
          refreshUI();
          showClientDetail(client);
        }
      });
      detail.appendChild(seoForm);
      // Appointment section for clients — allow scheduling and editing
      const cApptSection = document.createElement('div');
      cApptSection.style.marginTop = '1rem';
      const cApptHeader = document.createElement('h3');
      cApptHeader.textContent = 'Appointment';
      cApptSection.appendChild(cApptHeader);
      const cApptDisplay = document.createElement('div');
      cApptSection.appendChild(cApptDisplay);
      const cApptFormDiv = document.createElement('div');
      cApptSection.appendChild(cApptFormDiv);
      function renderClientAppt() {
        cApptDisplay.innerHTML = '';
        cApptFormDiv.innerHTML = '';
        if (client.appointment && typeof client.appointment === 'object' && client.appointment.datetime) {
          const dtc = new Date(client.appointment.datetime);
          const pAppt = document.createElement('p');
          pAppt.innerHTML = `<strong>Scheduled:</strong> ${dtc.toLocaleString()} (${client.appointment.status})`;
          cApptDisplay.appendChild(pAppt);
          const eBtn = document.createElement('button');
          eBtn.textContent = 'Edit Appointment';
          eBtn.className = 'control secondary';
          eBtn.addEventListener('click', () => {
            showClientApptForm(true);
          });
          cApptDisplay.appendChild(eBtn);
        } else {
          const b = document.createElement('button');
          b.textContent = 'Schedule Appointment';
          b.className = 'control';
          b.addEventListener('click', () => {
            showClientApptForm(false);
          });
          cApptDisplay.appendChild(b);
        }
      }
      function showClientApptForm(editing) {
        cApptDisplay.innerHTML = '';
        cApptFormDiv.innerHTML = '';
        const f = document.createElement('form');
        f.innerHTML = `
          <div class='form-group'>
            <label>Date & Time</label>
            <input type='datetime-local' name='datetime' required />
          </div>
          <div class='form-group'>
            <label>Type</label>
            <select name='status'>
              <option value='pitch'>Pitch</option>
              <option value='close'>Close</option>
              <option value='follow-up'>Follow-Up</option>
            </select>
          </div>
          <button type='submit'>Save Appointment</button>
          <button type='button' id='cancelClientAppt' class='secondary' style='margin-left:0.5rem'>Cancel</button>
        `;
        if (editing && client.appointment && client.appointment.datetime) {
          const inp = f.querySelector("input[name='datetime']");
          const dte = new Date(client.appointment.datetime);
          inp.value = dte.toISOString().slice(0,16);
          const sel2 = f.querySelector("select[name='status']");
          sel2.value = client.appointment.status;
        }
        f.addEventListener('submit', (ev) => {
          ev.preventDefault();
          const dv = f.querySelector("input[name='datetime']").value;
          const sv = f.querySelector("select[name='status']").value;
          if (dv) {
            const isEdit = editing;
            client.appointment = { datetime: dv, status: sv };
            // Log appointment schedule/update in the client's notes
            if (!client.notes) client.notes = [];
            const readable = new Date(dv).toLocaleString();
            const noteText = (isEdit ? 'Appointment updated: ' : 'Appointment scheduled: ') + sv + ' at ' + readable;
            client.notes.push({ content: noteText, timestamp: new Date().toLocaleString() });
            saveData();
            refreshUI();
            showClientDetail(client);
          }
        });
        f.querySelector('#cancelClientAppt').addEventListener('click', () => {
          renderClientAppt();
        });
        cApptFormDiv.appendChild(f);
      }
      renderClientAppt();
      detail.appendChild(cApptSection);
      // Control buttons: Edit and Delete
      const ctrl = document.createElement('div');
      ctrl.className = 'detail-control';
      // Edit client button – opens an editing form for the client
      const editBtn = document.createElement('button');
      editBtn.textContent = 'Edit Client';
      editBtn.className = 'secondary';
      editBtn.addEventListener('click', () => {
        showEditClient(client);
      });
      ctrl.appendChild(editBtn);
      // Delete client button
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete Client';
      delBtn.className = 'danger';
      delBtn.addEventListener('click', () => {
        if (confirm('Delete this client?')) {
          clients = clients.filter(c => c.id !== client.id);
          saveData();
          refreshUI();
          detail.classList.remove('active');
        }
      });
      ctrl.appendChild(delBtn);
      detail.appendChild(ctrl);
    }
    // File input listener
    document.getElementById('csvFile').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        importCSV(content);
      };
      reader.readAsText(file);
      event.target.value = '';
    });
    // Clients CSV import listener
    document.getElementById('csvFileClients').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        importClientsCSV(content);
      };
      reader.readAsText(file);
      event.target.value = '';
    });
    // Appointments CSV import listener
    document.getElementById('csvFileAppointments').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        importAppointmentsCSV(content);
      };
      reader.readAsText(file);
      event.target.value = '';
    });
    // Templates CSV import listener
    document.getElementById('csvFileTemplates').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        importTemplatesCSV(content);
      };
      reader.readAsText(file);
      event.target.value = '';
    });
    // Import all data (JSON) listener
    document.getElementById('jsonFileAll').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const obj = JSON.parse(e.target.result);
          importAllData(obj);
        } catch (err) {
          alert('Failed to import data: invalid JSON');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    });
    // On load
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      refreshUI();

      // Add listener for the new global script toggle button
      const toggleBtn = document.getElementById('scriptToggleBtn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          toggleScriptSidebar();
          // Update arrow
          const mainEl = document.querySelector('main');
          if (mainEl.classList.contains('sidebar-visible')) {
            toggleBtn.innerHTML = '&laquo;';
          } else {
            toggleBtn.innerHTML = '&raquo;';
          }
        });
      }
    });
  </script>
  <!-- Toast notifications container -->
  <div id="toastContainer"></div>
</body>
